<!-- INJECTED PASSWALL2 URL-TEST PATCH (UNIVERSAL) -->
<script type="text/javascript">
(function() {
    function injectUrlTestButton() {
        if (document.getElementById("btn_test_all_urls")) return;

        var targetBtn = document.querySelector('input[onclick*="delete_select_nodes"]') || 
                        document.querySelector('.pw-toolbar-field input[onclick*="delete"]') ||
                        document.querySelector('input[value*="Delete"]');

        if (!targetBtn || !targetBtn.parentNode) return;

        var btn = document.createElement("input");
        btn.className = "btn cbi-button cbi-button-reset";
        btn.type = "button";
        btn.id = "btn_test_all_urls";
        btn.value = "Test All URLs";
        btn.style.marginLeft = "4px";
        btn.style.marginRight = "4px";
        btn.style.fontWeight = "bold";
        btn.style.cursor = "pointer";
        btn.style.color = "#169C31";
        btn.style.borderColor = "#169C31";

        targetBtn.parentNode.insertBefore(btn, targetBtn);

        btn.onclick = function() {
            let visibleContainer = document.querySelector('#cbi-passwall2-nodes > .cbi-tabcontainer[style*="display:block"]') || 
                                   document.querySelector('#cbi-passwall2-nodes > .cbi-tabcontainer[style*="display: block"]') || 
                                   document.getElementById('cbi-passwall2-nodes') || 
                                   document.getElementById('node_list') || 
                                   document;

            let urlTestTargets = visibleContainer.querySelectorAll('td.pw-urltest a, span.ping a[onclick*="urltest_node"], [onclick*="urltest_node"]');
            
            if (urlTestTargets.length === 0) {
                alert('No URL Test engines available in the current view.');
                return;
            }

            let totalTests = urlTestTargets.length;
            let completedTests = 0;
            let delay = 0;

            if (typeof XHR !== 'undefined') {
                var originalXHRGet = XHR.get;
                XHR.get = function(url, args, callback) {
                    if (url && url.indexOf('urltest_node') !== -1) {
                        var originalCallback = callback;
                        callback = function(xhr, data) {
                            if (originalCallback) originalCallback(xhr, data);
                            completedTests++;
                            if (completedTests === totalTests) {
                                XHR.get = originalXHRGet;
                                setTimeout(() => {
                                    let deadNodesFound = 0;
                                    let rowsToProcess = [];

                                    visibleContainer.querySelectorAll('tr.cbi-section-table-row, tr.tr').forEach(row => {
                                        let testTarget = row.querySelector('td.pw-urltest, [onclick*="urltest_node"]');
                                        let cb = row.querySelector('.nodes_select, input[type="checkbox"]');
                                        
                                        if (testTarget && cb) {
                                            let rowText = row.textContent || row.innerText || "";
                                            
                                            // Ignore system configurations
                                            if (rowText.includes('Shunt') || rowText.includes('Balancing') || rowText.includes('URLTest')) {
                                                cb.checked = false;
                                                return;
                                            }

                                            // Ignore metadata/info configs
                                            let lowerRowText = rowText.toLowerCase();
                                            if (
                                                lowerRowText.includes('gb') || 
                                                lowerRowText.includes('mb') || 
                                                lowerRowText.includes('day') || 
                                                lowerRowText.includes('expire') || 
                                                lowerRowText.includes('remaining') || 
                                                lowerRowText.includes('traffic') || 
                                                lowerRowText.includes('date') ||
                                                lowerRowText.includes('http://') ||
                                                lowerRowText.includes('https://')
                                            ) {
                                                cb.checked = false;
                                                return;
                                            }

                                            let text = testTarget.textContent || testTarget.innerText;
                                            let isDead = text.includes('Timeout') || text.includes('Error');
                                            
                                            if (isDead) {
                                                deadNodesFound++;
                                            }
                                            rowsToProcess.push({ checkbox: cb, dead: isDead });
                                        }
                                    });

                                    // Trigger confirmation ONLY if dead proxies exist
                                    if (deadNodesFound > 0) {
                                        if (confirm('Global URL Testing Finished! Found ' + deadNodesFound + ' dead/timed-out proxies. Select them for removal now?')) {
                                            rowsToProcess.forEach(item => {
                                                item.checkbox.checked = item.dead;
                                            });
                                            if (typeof update_select_state === 'function') update_select_state();
                                        }
                                    } else {
                                        // Untick all valid proxies if re-testing was fully successful
                                        rowsToProcess.forEach(item => { item.checkbox.checked = false; });
                                        if (typeof update_select_state === 'function') update_select_state();
                                        alert('Global URL Testing Finished! All tested configurations are healthy and alive 🎉');
                                    }
                                }, 500);
                            }
                        };
                    }
                    return originalXHRGet.apply(this, arguments);
                };
            }

            urlTestTargets.forEach(target => {
                setTimeout(() => { target.click(); }, delay);
                delay += 100;
            });
        };
    }

    var checkInterval = setInterval(function() {
        injectUrlTestButton();
        if (document.getElementById("btn_test_all_urls")) {
            clearInterval(checkInterval);
        }
    }, 300);

    setTimeout(function() { clearInterval(checkInterval); }, 10000);
})();
</script>
<!-- END OF INJECTED PATCH -->
